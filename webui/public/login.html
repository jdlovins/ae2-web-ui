<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="favicon.ico" />
    <title>ME Terminal — Sign in</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #0e1119; color: #dfe6f2;
        font-family: "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 20px;
      }
      .card {
        width: 100%; max-width: 320px; background: #141a27;
        border: 1px solid #2b3855; border-radius: 12px; padding: 28px 24px;
        display: flex; flex-direction: column; gap: 14px;
      }
      .brand { display: flex; align-items: center; gap: 10px; color: #5fe3c9; font-weight: 500; font-size: 18px; }
      .brand svg { width: 26px; height: 26px; }
      .hint { margin: 0; color: #7c8aac; font-size: 13px; }
      .ipt { display: flex; align-items: center; gap: 8px; background: #1a2133; border: 1px solid #2b3855; border-radius: 8px; padding: 0 12px; color: #6f7fa3; }
      .ipt.err { border-color: #5a2b28; }
      .ipt input { flex: 1; background: transparent; border: 0; outline: none; color: #dfe6f2; font-size: 15px; padding: 11px 0; font-family: inherit; }
      .row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #aab6d0; }
      .row input { accent-color: #5fe3c9; }
      button {
        font-family: inherit; font-size: 15px; color: #5fe3c9; background: #14261f;
        border: 1px solid #245c45; border-radius: 8px; padding: 11px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      button:hover { background: #163027; }
      button:disabled { opacity: 0.6; cursor: default; }
      .error { color: #e2726b; font-size: 12.5px; min-height: 1em; }
      .note { margin: 0; text-align: center; color: #6f7fa3; font-size: 11.5px; }
      .spin { animation: sp 0.9s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <form class="card" id="form">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1"/><rect x="10.5" y="10.5" width="3" height="3"/><path d="M10 4v2M14 4v2M10 18v2M14 18v2M4 10h2M4 14h2M18 10h2M18 14h2"/></svg>
        <span>ME Terminal</span>
      </div>
      <p class="hint">This service requires authentication.</p>
      <div class="ipt" id="wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus />
      </div>
      <div class="error" id="err"></div>
      <button type="submit" id="btn">Sign in</button>
      <p class="note">You'll stay signed in on this device.</p>
    </form>

    <script>
      var PW_KEY = 'ae2_pw';
      var form = document.getElementById('form');
      var pw = document.getElementById('pw');
      var err = document.getElementById('err');
      var btn = document.getElementById('btn');
      var wrap = document.getElementById('wrap');

      function setToken(token) {
        document.cookie = 'authenticationToken=' + token + '; max-age=604800; path=/';
      }

      async function authenticate(password, remember) {
        var body = new URLSearchParams({ username: 'Admin', password: password });
        if (remember) body.set('remember', 'on');
        var res = await fetch('/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body.toString(),
        });
        if (!res.ok) return false;
        var data = await res.json();
        if (!data || !data.token) return false;
        setToken(data.token);
        return true;
      }

      async function submit(e) {
        if (e) e.preventDefault();
        var password = pw.value;
        if (!password) return;
        btn.disabled = true; err.textContent = ''; wrap.classList.remove('err');
        btn.innerHTML = '<svg class="spin" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M4.9 4.9l2.1 2.1M16.95 16.95l2.15 2.15M3 12h3M18 12h3M4.9 19.1l2.1-2.1M16.95 7.05l2.15-2.15"/></svg> Signing in…';
        var ok = await authenticate(password, true);
        if (ok) {
          localStorage.setItem(PW_KEY, password);
          location.href = '/';
        } else {
          btn.disabled = false; btn.textContent = 'Sign in';
          wrap.classList.add('err'); err.textContent = 'Invalid password'; pw.value = ''; pw.focus();
        }
      }
      form.addEventListener('submit', submit);

      // Auto sign-in if we already have a cached password (token expired but
      // credentials remembered) — the user never has to type it again.
      (async function () {
        var cached = localStorage.getItem(PW_KEY);
        if (!cached) return;
        btn.disabled = true;
        if (await authenticate(cached, true)) { location.href = '/'; }
        else { localStorage.removeItem(PW_KEY); btn.disabled = false; }
      })();
    </script>
  </body>
</html>
