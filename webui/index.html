<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="favicon.ico" />
    <title>ME Terminal</title>
    <script>
      // These string literals are replaced server-side by the mod's WebHandler
      // (literal String.replace). Keeping them as quoted strings means they
      // survive minification and stay valid JS during local dev (no replacement).
      (function () {
        var v = '_REPLACE_ME_VERSION_OUTDATED';
        var u = '_REPLACE_ME_USERNAME';
        var a = '_REPLACE_ME_IS_ADMIN';
        window.__AE2__ = {
          isOutdated: v === 'true',
          username: u && u.indexOf('REPLACE_ME') === -1 ? u : 'Admin',
          isAdmin: a !== 'false',
        };
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
