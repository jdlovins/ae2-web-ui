# AE2 web terminal — k3s / Traefik deployment.
#
# Three workloads: webui (nginx + SPA), gateway (cache + collector), timescale
# (the Trends time-series). The mod is NOT deployed here — it runs inside your
# Minecraft server, and AE2_URL points at it.
#
# Only the webui is exposed. nginx inside it routes the API on to the gateway or
# the mod, so the gateway must NOT get its own IngressRoute: reaching it directly
# bypasses that routing and splits the cache.
#
# Before applying:
#   1. Set AE2_URL in the ConfigMap to your Minecraft server, reachable FROM THE
#      CLUSTER (a LAN address, never 127.0.0.1).
#   2. Set the host in the IngressRoute at the bottom.
#   3. Create the Secret — never commit passwords:
#        kubectl create namespace ae2
#        kubectl -n ae2 create secret generic ae2-web \
#          --from-literal=AE2_PASSWORD='your-mod-admin-password' \
#          --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)"
#
#   kubectl apply -f k8s/ae2-web.yaml
#
# Not using Traefik's CRDs? Replace the IngressRoute with a plain Ingress
# (ingressClassName: traefik) pointing at the ae2-webui Service on port 80.
# Nothing else changes.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ae2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ae2-web
  namespace: ae2
data:
  # The mod's HTTP API. No trailing slash or path.
  AE2_URL: "http://10.10.10.100:65500" # <-- set me
  AE2_USERNAME: "Admin"
  # /items walks the whole network on the Minecraft server tick, so sampling too
  # fast will visibly lag the game. Below ~15s is strongly discouraged.
  SAMPLE_INTERVAL_SEC: "60"
  # Empty = discover and track every attached grid.
  SAMPLE_GRIDS: ""
  # e.g. "365 days". Empty keeps history forever.
  SAMPLE_RETENTION: ""
  POSTGRES_DB: "ae2"
  POSTGRES_USER: "ae2"
  # Cosmetic: affects container log timestamps only. Samples are stored as
  # timestamptz (UTC) and the charts render in the browser's local zone, so
  # changing this will not shift any data.
  TZ: "US/Eastern"
---
# TimescaleDB. A StatefulSet rather than a Deployment: it owns persistent state
# and must never be rolled out in parallel with itself.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: ae2-timescale
  name: ae2-timescale
  namespace: ae2
spec:
  serviceName: ae2-timescale
  replicas: 1
  selector:
    matchLabels:
      app: ae2-timescale
  template:
    metadata:
      labels:
        app: ae2-timescale
    spec:
      containers:
        - name: timescale
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: ae2-web, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: ae2-web, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ae2-web, key: POSTGRES_PASSWORD } }
            - name: TZ
              valueFrom: { configMapKeyRef: { name: ae2-web, key: TZ } }
            # Postgres refuses to initialise into a non-empty directory, and a
            # freshly formatted iSCSI volume arrives with a lost+found. Keep the
            # cluster in a subdirectory or first start fails.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
      restartPolicy: Always
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: freenas-iscsi
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # One sample per item per minute, compressed after 7 days and
            # segmented by item_id, which compresses hard. 10Gi holds years.
            # Raise it before you need it — most storage classes cannot shrink.
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ae2-timescale
  namespace: ae2
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app: ae2-timescale
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ae2-gateway
  name: ae2-gateway
  namespace: ae2
spec:
  # Must stay at 1. The read cache is in-process memory, so N replicas means N
  # independent caches, N pollers, and N× the load on the Minecraft server tick —
  # the exact thing this service exists to prevent.
  replicas: 1
  # Recreate, not RollingUpdate, for the same reason: a rolling update would run
  # two gateways at once mid-rollout, briefly doubling that load.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ae2-gateway
  template:
    metadata:
      labels:
        app: ae2-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/jdlovins/ae2-web-ui/gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: AE2_URL
              valueFrom: { configMapKeyRef: { name: ae2-web, key: AE2_URL } }
            - name: AE2_USERNAME
              valueFrom: { configMapKeyRef: { name: ae2-web, key: AE2_USERNAME } }
            - name: AE2_PASSWORD
              valueFrom: { secretKeyRef: { name: ae2-web, key: AE2_PASSWORD } }
            - name: SAMPLE_INTERVAL_SEC
              valueFrom: { configMapKeyRef: { name: ae2-web, key: SAMPLE_INTERVAL_SEC } }
            - name: SAMPLE_GRIDS
              valueFrom: { configMapKeyRef: { name: ae2-web, key: SAMPLE_GRIDS } }
            - name: SAMPLE_RETENTION
              valueFrom: { configMapKeyRef: { name: ae2-web, key: SAMPLE_RETENTION } }
            - name: TZ
              valueFrom: { configMapKeyRef: { name: ae2-web, key: TZ } }
            # Discrete PG* variables rather than a DATABASE_URL. node-pg reads
            # these natively, and the password never gets spliced into a URL —
            # a POSTGRES_PASSWORD containing '@' would otherwise make the driver
            # parse the remainder as the hostname and fail with a DNS error
            # instead of an auth error.
            - name: PGHOST
              value: ae2-timescale
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom: { configMapKeyRef: { name: ae2-web, key: POSTGRES_DB } }
            - name: PGUSER
              valueFrom: { configMapKeyRef: { name: ae2-web, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: ae2-web, key: POSTGRES_PASSWORD } }
          # /history/ping is the ONLY unauthenticated route, and exists for this.
          # Every other route needs a token the mod accepts, so probing one would
          # 401 and restart a healthy pod forever.
          readinessProbe:
            httpGet:
              path: /history/ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /history/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ae2-gateway
  namespace: ae2
spec:
  ports:
    - name: http
      port: 8081
      targetPort: http
  selector:
    app: ae2-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ae2-webui
  name: ae2-webui
  namespace: ae2
spec:
  # Stateless — static files plus a reverse proxy — so this one may scale freely.
  # Extra replicas do not add load on the game server; they share the gateway's
  # single cache.
  replicas: 1
  selector:
    matchLabels:
      app: ae2-webui
  template:
    metadata:
      labels:
        app: ae2-webui
    spec:
      containers:
        - name: webui
          image: ghcr.io/jdlovins/ae2-web-ui/webui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # nginx sends writes, /auth and the cheap async routes straight to
            # the mod…
            - name: MOD_UPSTREAM
              valueFrom: { configMapKeyRef: { name: ae2-web, key: AE2_URL } }
            # …and the four expensive reads plus /history/* to the gateway.
            - name: GATEWAY_UPSTREAM
              value: http://ae2-gateway:8081
            - name: TZ
              valueFrom: { configMapKeyRef: { name: ae2-web, key: TZ } }
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ae2-webui
  namespace: ae2
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: ae2-webui
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: ae2-webui
  namespace: ae2
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ae2.mclovins.org`) # <-- set me
      kind: Rule
      middlewares:
        # The app has its own login on top of this (it authenticates against the
        # mod), so authentik is a second factor rather than the only one. Drop
        # these two lines to rely on the app's own auth alone.
        - name: authentik-middlewares-authentik@kubernetescrd
      services:
        # Everything enters through the webui — it serves the SPA and routes the
        # API onward. Never point this at ae2-gateway.
        - name: ae2-webui
          port: 80
  tls: {}
