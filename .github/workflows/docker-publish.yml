# Builds and publishes the web stack's container images to GHCR.
#
# GHCR rather than Docker Hub: it's free for public images, authenticates with the
# built-in GITHUB_TOKEN (no secrets to configure), and doesn't rate-limit pulls.
#
# Images:
#   ghcr.io/<owner>/<repo>/webui     nginx + the built SPA + the item icon pack
#   ghcr.io/<owner>/<repo>/gateway   caching API gateway + inventory collector
#
# The mod jar is NOT built here — see the existing Gradle build for that.

name: Publish container images

on:
  push:
    branches: [master, gtnh-native-fluid]
    tags: ['v*']
  pull_request:
    paths:
      - webui/**
      - gateway/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
    inputs:
      force_all:
        description: Build both images even if unchanged
        type: boolean
        default: false

concurrency:
  # One build per ref; a new push supersedes an in-flight one.
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Only rebuild what changed. The webui image is the slow one (it bakes ~50k
  # icon PNGs), so a gateway-only change shouldn't pay for it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      webui: ${{ steps.filter.outputs.webui }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff against the previous commit

      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          # Tags, manual runs and first-push events have no useful "before" SHA:
          # build everything rather than guess.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_all }}" == "true" ]] \
            || [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "webui=true"   >> "$GITHUB_OUTPUT"
            echo "gateway=true" >> "$GITHUB_OUTPUT"
            echo "Building both (tag or forced run)"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # All-zero SHA means a new branch/first push; fall back to the parent.
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi

          if [[ -z "$base" ]]; then
            echo "webui=true"   >> "$GITHUB_OUTPUT"
            echo "gateway=true" >> "$GITHUB_OUTPUT"
            echo "No base commit to diff; building both"
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          # The workflow itself counts as a change to both.
          if grep -qE '^webui/|^\.github/workflows/docker-publish\.yml$' <<<"$changed"; then
            echo "webui=true" >> "$GITHUB_OUTPUT"
          else
            echo "webui=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^gateway/|^\.github/workflows/docker-publish\.yml$' <<<"$changed"; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway=false" >> "$GITHUB_OUTPUT"
          fi

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Pull requests from forks get no package write token, so only push on
        # branches/tags of this repo.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (GHCR requires lowercase)
        id: name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/gateway" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  webui:
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      # The icon pack is gitignored (~50k PNGs) and the Dockerfile only COPYs it,
      # so it has to be generated before the image build or the image ships
      # without icons.
      - name: Cache the GTNH atlas download
        uses: actions/cache@v4
        with:
          path: webui/.icon-cache
          # Re-download only when the pack version in the script changes.
          key: gtnh-atlas-${{ hashFiles('webui/scripts/fetch-icons.mjs') }}
          restore-keys: gtnh-atlas-

      - name: Install and generate the icon pack
        working-directory: webui
        run: |
          npm ci
          npm run icons
          echo "icons: $(find icons -name '*.png' | wc -l) PNGs, $(du -sh icons | cut -f1)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (GHCR requires lowercase)
        id: name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/webui" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: webui
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=webui
          cache-to: type=gha,mode=max,scope=webui
